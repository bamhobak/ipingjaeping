<style>
/* 세로 한 화면 도로(캔버스) 위에 스티커 같은 HTML 창을 얹는 구성. 한 가지 모습으로 고정(밤낮 테마 없음) */
:root {
  --ink: #1d1b22;       /* 굵은 외곽선·글자 */
  --asphalt: #3a3c44;   /* 도로 */
  --pink: #ff5fa2;      /* 이핑재핑 차 */
  --sticker: #ffd23f;   /* 난폭운전 스티커·주요 버튼 */
  --mint: #3ec7a6;      /* 내 차 */
  --paper: #fffdf6;     /* 사고 경위서 종이 */
  --rule: #c9c4b8;      /* 서식 칸 선 */
  --soft: #f1ede3;      /* 서식 머리칸 */
  --gray: #d9d6cf;      /* 보조 버튼 */
  --stamp: #d8312f;     /* 도장 */
  --dim: rgba(24, 20, 34, .62);
  --f-display: "Jua", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #6fb35f; color: var(--ink); }
body { font-family: var(--f-body); word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#stage {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: #6fb35f;
}
#wrap { position: relative; overflow: hidden; --s: 1; box-shadow: 0 0 0 3px var(--ink); }
canvas { display: block; touch-action: none; }
.u { font-size: calc(var(--s) * 15px); }

.ov {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--s) * 14px); padding: calc(var(--s) * 20px); text-align: center; background: var(--dim);
}
.btn {
  font: inherit; font-family: var(--f-display); font-size: calc(var(--s) * 22px); line-height: 1;
  color: var(--ink); background: var(--sticker); border: calc(var(--s) * 2.5px) solid var(--ink);
  border-radius: calc(var(--s) * 10px); padding: calc(var(--s) * 14px) calc(var(--s) * 30px);
  box-shadow: 0 calc(var(--s) * 4px) 0 var(--ink); cursor: pointer; touch-action: manipulation;
}
.btn:active { transform: translateY(calc(var(--s) * 3px)); box-shadow: 0 calc(var(--s) * 1px) 0 var(--ink); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.gray { background: var(--gray); font-size: calc(var(--s) * 17px); padding: calc(var(--s) * 12px) calc(var(--s) * 18px); }
.row { display: flex; gap: calc(var(--s) * 10px); justify-content: center; flex-wrap: wrap; }

/* 첫 화면 */
#title { gap: calc(var(--s) * 26px);background: linear-gradient(to bottom, rgba(24,20,34,.25), rgba(24,20,34,.7) 70%); }
.chobo {
  display: inline-flex; flex-direction: column; align-items: center; gap: calc(var(--s) * 2px);
  background: var(--sticker); border: calc(var(--s) * 2.5px) solid var(--ink); border-radius: calc(var(--s) * 8px);
  padding: calc(var(--s) * 6px) calc(var(--s) * 16px); transform: rotate(-6deg);
  box-shadow: calc(var(--s) * 3px) calc(var(--s) * 4px) 0 rgba(0,0,0,.35);
}
.chobo b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s) * 22px); letter-spacing: .08em; }
.chobo small { font-size: calc(var(--s) * 11px); font-weight: 700; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400; line-height: .98; letter-spacing: -.01em;
  font-size: calc(var(--s) * 64px); color: var(--sticker); text-wrap: balance;
  text-shadow:
    calc(var(--s) * 3px) 0 0 var(--ink), calc(var(--s) * -3px) 0 0 var(--ink), 0 calc(var(--s) * 3px) 0 var(--ink), 0 calc(var(--s) * -3px) 0 var(--ink),
    calc(var(--s) * 2px) calc(var(--s) * 2px) 0 var(--ink), calc(var(--s) * -2px) calc(var(--s) * -2px) 0 var(--ink), calc(var(--s) * 2px) calc(var(--s) * -2px) 0 var(--ink), calc(var(--s) * -2px) calc(var(--s) * 2px) 0 var(--ink),
    0 calc(var(--s) * 8px) 0 var(--ink);
}
h1 span { color: var(--pink); display: block; }
.lead { margin: 0; max-width: 30ch; color: #fff; font-size: calc(var(--s) * 14px); line-height: 1.6; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.how { margin: 0; color: #fff; font-size: calc(var(--s) * 12px); opacity: .9; }
.rec { display: flex; gap: calc(var(--s) * 8px); }
.rec span {
  font-size: calc(var(--s) * 12px); font-weight: 700; background: rgba(255,255,255,.92); border: 2px solid var(--ink);
  border-radius: calc(var(--s) * 6px); padding: calc(var(--s) * 4px) calc(var(--s) * 8px); font-variant-numeric: tabular-nums;
}
.ver { position: absolute; right: calc(var(--s) * 10px); bottom: calc(var(--s) * 8px); color: rgba(255,255,255,.75); font-size: calc(var(--s) * 11px); }

/* 게임 중 단추 */
#hud { position: absolute; top: calc(var(--s) * 12px); right: calc(var(--s) * 12px); display: flex; gap: calc(var(--s) * 8px); }
.ib {
  width: calc(var(--s) * 40px); height: calc(var(--s) * 40px); display: grid; place-items: center; padding: 0;
  font: inherit; font-family: var(--f-display); font-size: calc(var(--s) * 17px); color: var(--ink);
  background: rgba(255,255,255,.92); border: calc(var(--s) * 2.5px) solid var(--ink); border-radius: calc(var(--s) * 9px);
  box-shadow: 0 calc(var(--s) * 3px) 0 var(--ink); cursor: pointer; touch-action: manipulation;
}
.ib:focus-visible { outline: 3px solid #fff; }

/* 정차 */
#pause h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s) * 40px); color: #fff; text-shadow: 0 calc(var(--s) * 4px) 0 var(--ink); }

/* 사고 경위서 */
#report { justify-content: center; }
.paper {
  width: 100%; max-width: calc(var(--s) * 330px); background: var(--paper); border: calc(var(--s) * 2.5px) solid var(--ink);
  border-radius: calc(var(--s) * 4px); padding: calc(var(--s) * 14px) calc(var(--s) * 14px) calc(var(--s) * 12px);
  box-shadow: calc(var(--s) * 4px) calc(var(--s) * 6px) 0 rgba(0,0,0,.4); text-align: left; position: relative;
  transform: rotate(-1.2deg); animation: drop .38s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes drop { from { transform: translateY(-30px) rotate(-6deg); opacity: .4; } }
.ph { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double var(--ink); padding-bottom: calc(var(--s) * 6px); }
.ph b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s) * 25px); letter-spacing: .3em; }
.ph small { font-size: calc(var(--s) * 11px); font-weight: 700; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; margin-top: calc(var(--s) * 8px); font-size: calc(var(--s) * 12.5px); }
th, td { border: 1px solid var(--rule); padding: calc(var(--s) * 5px) calc(var(--s) * 7px); vertical-align: top; line-height: 1.4; }
th { width: 28%; background: var(--soft); font-weight: 700; text-align: left; white-space: nowrap; font-size: calc(var(--s) * 11.5px); }
td { font-weight: 700; }
td.quote { font-weight: 400; font-style: italic; }
.fault { display: flex; height: calc(var(--s) * 18px); border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; font-size: calc(var(--s) * 10.5px); font-weight: 800; margin-top: 3px; }
.fault i { font-style: normal; display: grid; place-items: center; white-space: nowrap; overflow: hidden; }
.fault .a { background: var(--pink); color: #fff; }
.fault .b { background: var(--mint); color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--s) * 6px); margin-top: calc(var(--s) * 10px); }
.stats div { border: 1.5px solid var(--ink); border-radius: calc(var(--s) * 5px); padding: calc(var(--s) * 5px) calc(var(--s) * 4px); text-align: center; background: #fff; }
.stats small { display: block; font-size: calc(var(--s) * 10px); font-weight: 700; color: #6b6574; }
.stats b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s) * 17px); font-variant-numeric: tabular-nums; }
.score { margin-top: calc(var(--s) * 10px); display: flex; justify-content: space-between; align-items: baseline; }
.score small { font-size: calc(var(--s) * 12px); font-weight: 700; }
.score b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--s) * 32px); font-variant-numeric: tabular-nums; }
.newbest { display: inline-block; margin-left: 6px; font-family: var(--f-display); font-size: calc(var(--s) * 13px); background: var(--sticker); border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 6px; transform: rotate(-4deg); }
.stamp {
  position: absolute; left: 38%; bottom: calc(var(--s) * 4px); width: calc(var(--s) * 64px); height: calc(var(--s) * 64px);
  border: calc(var(--s) * 3px) solid var(--stamp); border-radius: 50%; color: var(--stamp); display: grid; place-items: center; text-align: center;
  font-family: var(--f-display); font-size: calc(var(--s) * 13px); line-height: 1.05; transform: rotate(-14deg); opacity: .82; pointer-events: none;
  animation: stamp .3s .35s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes stamp { from { transform: scale(2.4) rotate(-14deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .paper, .stamp { animation: none; } }
</style>

<body>

<div id="stage">
  <div id="wrap">
    <canvas id="cv"></canvas>

    <div id="hud" hidden>
      <button class="ib" id="btnMute" aria-label="소리 켜고 끄기">🔊</button>
      <button class="ib" id="btnPause" aria-label="잠깐 멈춤">Ⅱ</button>
    </div>

    <div id="title" class="ov">
      <div class="chobo"><b>난폭운전</b></div>
      <h1>이핑재핑<span>피하기</span></h1>
      <button class="btn" id="btnStart">출발!</button>
      <div class="rec"><span id="recBest">최고 0점</span></div>
      <div class="ver" id="ver"></div>
    </div>

    <div id="pause" class="ov" hidden>
      <h2>잠깐 정차 중</h2>
      <div class="row">
        <button class="btn gray" id="btnQuit">← 처음으로</button>
        <button class="btn" id="btnResume">계속 가기</button>
      </div>
    </div>

    <div id="report" class="ov" hidden>
      <div class="paper">
        <div class="ph"><b>사고경위서</b><small id="rNo">제 0001 호</small></div>
        <table>
          <tr><th>사고 일시</th><td id="rDate"></td></tr>
          <tr><th>사고 장소</th><td id="rPlace"></td></tr>
          <tr><th>상대 차량</th><td id="rCar"></td></tr>
          <tr><th>사고 유형</th><td id="rType"></td></tr>
          <tr><th>상대 진술</th><td id="rSays" class="quote"></td></tr>
          <tr><th>과실 비율</th><td><div class="fault"><i class="a" id="rFa"></i><i class="b" id="rFb"></i></div></td></tr>
        </table>
        <div class="stats">
          <div><small>주행 거리</small><b id="rDist">0m</b></div>
          <div><small>아슬아슬</small><b id="rNear">0회</b></div>
          <div><small>이핑재핑 피해차</small><b id="rVic">0대</b></div>
        </div>
        <div class="score"><small>최종 점수</small><span><b id="rScore">0</b><span class="newbest" id="rNew" hidden>최고 기록!</span></span></div>
        <div class="stamp" id="rStamp">이핑<br>재핑</div>
      </div>
      <div class="row">
        <button class="btn gray" id="btnHome">← 처음으로</button>
        <button class="btn" id="btnRetry">다시 출발</button>
      </div>
    </div>
  </div>
</div>

<script>

const VERSION = 'v0.1.06';

/* ───── 소리 ───── */
const SFX = {
  hornA:   [.7,0,330,0,.13,.05,5,1],
  hornB:   [.6,0,415,0,.13,.05,5,1],
  screech: [.45,.05,1700,.02,.28,.2,2,1.5,-1,0,0,0,0,.4,0,0,0,.6,0,.35],
  crash:   [2,.2,60,.01,.2,.6,4,1,-.5,0,0,0,0,2,0,.4,0,.5,.1],
  bump:    [1,.2,90,.01,.08,.3,4,1,-1,0,0,0,0,1.5,0,.3],
  near:    [.8,.05,700,0,.02,.22,0,1,0,0,440,.05],
  warn:    [.45,0,880,0,.06,.04,5,1],
  start:   [1,.05,400,0,.15,.3,1,1,0,0,300,.08,.08],
  over:    [1,0,400,0,.2,.5,2,1,-3,0,0,0,0,0,0,0,.1,.7,.1],
  click:   [.6,0,800,0,.01,.03,5],
};
let sfxOn = true;
const sfxLast = {};
function sfx(name, vol = 1) {
  if (!sfxOn || !SFX[name]) return;
  const now = performance.now();
  if (now - (sfxLast[name] || 0) < 60) return;
  sfxLast[name] = now;
  const p = SFX[name].slice(); p[0] = (p[0] ?? 1) * vol;
  try { zzfx(...p); } catch (e) {}
}
function honk() { sfx('hornA'); sfx('hornB'); setTimeout(() => { sfx('hornA'); sfx('hornB'); }, 170); }
for (const ev of ['pointerdown', 'touchend']) addEventListener(ev, () => zzfxX && zzfxX.state !== 'running' && zzfxX.resume(), { passive: true });

/* ───── 저장(실패해도 게임은 돈다) ───── */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ipjp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ipjp_' + k, JSON.stringify(v)); } catch (e) {} },
};
let best = store.get('best', 0), crashes = store.get('crashes', 0);
sfxOn = store.get('sound', true);

/* ───── 화면 ───── */
const W = 360; let H = 640;
const ROAD_L = 34, ROAD_R = 326, LANE_W = (ROAD_R - ROAD_L) / 4;
const laneX = i => ROAD_L + LANE_W * (i + .5);
const laneOf = x => Math.max(0, Math.min(3, Math.floor((x - ROAD_L) / LANE_W)));
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap'), stage = $('stage');
let scale = 1, dpr = 1, lastSW = 0, lastSH = 0;
function resize() {
  const cs = getComputedStyle(stage);
  lastSW = stage.clientWidth; lastSH = stage.clientHeight;
  // 카톡 인앱 브라우저는 처음에 화면 크기를 틀리게 줄 때가 있어 창 크기와 둘 중 작은 쪽을 쓴다
  const sw = Math.min(lastSW, window.innerWidth || lastSW), sh = Math.min(lastSH, window.innerHeight || lastSH);
  const aw = sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (aw < 50 || ah < 50) return;
  scale = Math.min(aw / W, ah / 560);
  H = Math.round(Math.min(800, Math.max(560, ah / scale)));
  dpr = Math.min(3, window.devicePixelRatio || 1);
  wrap.style.width = W * scale + 'px'; wrap.style.height = H * scale + 'px';
  wrap.style.setProperty('--s', scale);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
addEventListener('load', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
// 아이폰 확대(두 번 톡·핀치) 막기 — user-scalable=no 를 무시한다
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ───── 이핑재핑 운전 습관 ───── */
const PAT = {
  zigzag:   { name: '차선 넘나들며 칼질',   banner: '갈지자 주행 중',        bub: ['비켜 비켜~', '차선은 참고용이지'],          says: ['다들 너무 느려서요', '흐름 타고 있었는데요?', '제 차선은 제가 고르는 거죠'] },
  brake:    { name: '보복 급정거',          banner: '보복 급정거 주의',      bub: ['어디서 따라붙어!', '한번 혼나 볼래?'],      says: ['뒤에서 바짝 붙길래요', '교육 차원이었어요', '브레이크 잘 되나 본 거예요'] },

  signal:   { name: '깜빡이 반대로 끼어들기', banner: '깜빡이 믿지 마세요',  bub: ['깜빡이? 대충 켰어', '어차피 내가 먼저야'],   says: ['깜빡이 켰으면 된 거 아니에요?', '그쪽이 알아서 피했어야죠'] },
  charge:   { name: '뒤에서 들이밀기',      banner: '뒤에서 돌진 중',        bub: ['안 비키면 민다!', '풀악셀 간다~'],          says: ['길을 막고 있길래요', '저 원래 이 속도로 다녀요'] },
  spin:     { name: '도로 위 드리프트',     banner: '드리프트 중',           bub: ['드리프트 보여 줄게!', '이게 바로 실력이지'], says: ['드리프트 연습 중이었어요', '타이어 좀 데우느라요'] },
  parking:  { name: '도로 한복판 주차',     banner: '도로 위 주차',          bub: ['잠깐이면 돼!', '비상등 켰잖아~'],           says: ['비상등 켰잖아요', '5분이면 된다니까요'] },
  reverse:  { name: '후진으로 역주행',      banner: '후진 차량 접근',        bub: ['지나쳤네, 후진!', '뒤는 안 봐도 돼~'],      says: ['출구 지나쳐서 후진했어요', '뒤에 차가 있는 줄 몰랐죠'] },
  phone:    { name: '폰 보면서 운전',       banner: '휴대폰 보며 운전 중',   bub: ['게임 한 판만~', '헉!'],                     says: ['답장만 하려고 했어요', '한 손으로도 충분해요'] },
  lanehog:  { name: '차선 두 개 물고 가기', banner: '차선 물고 가는 중',     bub: ['두 차선 다 내 거야', '비키든가~'],          says: ['넓게 타야 안전해요', '선 밟으면 안 돼요?'] },
  cutin:    { name: '칼치기',               banner: '칼치기 주의',           bub: ['칼치기 간다!', '왜 안 비켜!'],              says: ['자리가 있어 보였어요', '깜빡이는 마음으로 켰어요'] },
  exit:     { name: '출구 직전 가로지르기', banner: '4차선 가로지르기',      bub: ['출구 저쪽이다!', '비켜 비켜~'],             says: ['내비가 늦게 말해 줬어요', '출구가 갑자기 나왔어요'] },
  uturn:    { name: '도로 한가운데 유턴',   banner: '불법 유턴 주의',        bub: ['여기서 유턴하면 빠르지', '왔던 길로 간다~'], says: ['유턴 금지는 권고 사항이잖아요', '집에 뭘 두고 와서요'] },
  tailgate: { name: '바짝 붙어 빵빵',       banner: '뒤에 바짝 붙음',        bub: ['빨리 좀 가요!', '빵빵!'],                   says: ['제가 좀 바빠서요', '앞차가 너무 느렸어요'] },
};
// 시간이 지나면 풀리는 습관(초) — 첫 이핑재핑도 0초 묶음에서 무작위
const TIERS = [
  [0,  ['zigzag', 'brake', 'wrongway', 'reverse', 'phone', 'lanehog']],
  [12, ['signal', 'charge', 'cutin', 'exit']],
  [25, ['spin', 'parking', 'uturn', 'tailgate']],
];
const FAST = new Set(['wrongway', 'charge', 'reverse', 'uturn', 'tailgate', 'cutin']);
const PLACES = ['핑재사거리', '이핑대교 북단', '재핑터널 입구', '난폭운전 교차로', '깜빡이로 7길', '빵빵동 주민센터 앞', '급정거 삼거리'];
const ROAD_TEXT = [['천천히'], ['서행'], ['양보'], ['주의', '이핑재핑'], ['정지']];

/* ───── 상태 ───── */
let S, T = 0;
const player = { x: W / 2, y: 0, w: 34, h: 58, hit: .82, ang: 0, va: 0, color: '#3ec7a6' };
let tx = 0, ty = 0;
function newState(mode) {
  return {
    mode, t: 0, v: 190, dist: 0, bonus: 0, near: 0, combo: 0, comboT: -9, victims: 0,
    traffic: [], ipjs: [], warns: [], parts: [], skids: [], marks: [], floats: [], banner: null,
    nextTraffic: .4, nextIPJ: mode === 'play' ? 2 : .8, nextMark: 1.5, nextCross: 10,
    lastPat: null, first: true, shake: 0, cause: null, crashT: 0, roadY: 0,
  };
}
const diff = () => Math.min(1, S.t / 150);
const score = () => Math.floor(S.dist) + S.bonus;

/* ───── 만들기 ───── */
function spawnTraffic() {
  const busy = new Set(S.traffic.filter(c => c.y < 230 && !c.wreck).map(c => c.lane));
  for (const o of S.ipjs) if (o.pat === 'parking' && o.y < 230) busy.add(laneOf(o.x));
  if (busy.size >= 2) { S.nextTraffic = .3; return; }
  const lane = pick([0, 1, 2, 3].filter(l => !busy.has(l)));
  const r = Math.random();
  const type = r < .55 ? 'sedan' : r < .7 ? 'taxi' : r < .88 ? 'truck' : 'bus';
  const [w, h] = { sedan: [34, 58], taxi: [34, 58], truck: [40, 84], bus: [42, 108] }[type];
  const color = type === 'sedan' ? pick(['#4a7c59', '#5b6b8c', '#c9473f', '#2f2f36', '#9aa5ad', '#e9c46a'])
    : type === 'taxi' ? '#f4a62a' : type === 'truck' ? '#3d7dd8' : '#2fa86a';
  S.traffic.push({ type, lane, x: laneX(lane) + rand(-4, 4), y: -h / 2 - 10, w, h, hit: .86, ang: 0, vx: 0, va: 0,
    frac: type === 'sedan' || type === 'taxi' ? rand(.5, .75) : rand(.45, .6), color, wreck: false, smokeT: 0 });
}

function addWarn(side, x, dur, label) { S.warns.push({ side, x, t: 0, dur, label }); sfx('warn'); setTimeout(() => sfx('warn'), 180); }
function say(o, i) { const b = PAT[o.pat].bub; o.bubble = b[i ?? (Math.random() * b.length | 0)]; o.bubbleT = 1.8; }

function spawnIPJ(pat) {
  const d = diff();
  const o = { ipj: true, pat, color: '#f6f6f3', avante: true, t: 0, delay: 0, x: W / 2, y: -80, w: 36, h: 62, hit: .84, ang: 0, vx: 0, vy: 0,
    sig: 0, brake: false, hazard: false, phase: 0, pt: 0, bubble: null, bubbleT: 0, nearIn: false, nearCool: 0, ownAng: false };
  const pl = laneOf(player.x);
  switch (pat) {
    case 'zigzag': {
      const back = !S.first && S.mode === 'play' && Math.random() < .55;
      o.cx = W / 2; o.amp = 92 + 22 * d; o.om = 2 + 1.3 * d; o.ph = rand(0, 6);
      o.x = o.cx + o.amp * Math.sin(o.ph);
      if (back) { o.y = H + 90; o.vy = -(110 + 70 * d); o.delay = .8; addWarn('bottom', W / 2, .8, '갈지자!'); }
      else { o.y = -80; o.vy = 120 + 60 * d; }
      say(o, 0); break;
    }
    case 'brake':
      o.x = laneX(pl); o.vy = 75 + 45 * d;
      o.trigY = Math.max(60, Math.min(player.y - 270, H * rand(.18, .3)));
      break;
    case 'wrongway':
      o.x = laneX(pl); o.y = -90; o.ang = Math.PI; o.ownAng = true; o.extra = 190 + 160 * d;
      o.delay = 1.05 - .25 * d; addWarn('top', o.x, o.delay, '역주행!');
      break;
    case 'signal': {
      const opts = [pl - 1, pl + 1].filter(l => l >= 0 && l <= 3);
      const L = pick(opts);
      o.x = laneX(L); o.S = Math.sign(L - pl); o.vy = 120; o.trigY = H * rand(.2, .3);
      break;
    }
    case 'charge':
      o.x = player.x; o.y = H + 90; o.delay = .9; addWarn('bottom', o.x, .9, '돌진!');
      break;
    case 'spin':
      o.x = rand(ROAD_L + 50, ROAD_R - 50); o.vy = 135 + 60 * d; o.vx = (110 + 60 * d) * (Math.random() < .5 ? -1 : 1);
      o.spin = rand(4, 6.5) * (Math.random() < .5 ? -1 : 1); o.ownAng = true; o.hazard = true; say(o);
      break;
    case 'parking':
      o.x = laneX(pick([0, 1, 2, 3])); o.vy = 110; o.trigY = H * rand(.06, .14); o.ownAng = true;
      break;
    case 'reverse':
      o.x0 = o.x = laneX(pl); o.y = -90; o.ownAng = true; o.rev = true; o.extra = 70 + 90 * d;
      o.delay = .8; addWarn('top', o.x, .8, '후진!');
      break;
    case 'phone':
      o.x = laneX(clamp(pl + pick([-1, 0, 1]), 0, 3)); o.vy = 95 + 45 * d; o.jerkT = rand(1.4, 2.2);
      o.dir = player.x > o.x + 10 ? 1 : player.x < o.x - 10 ? -1 : pick([-1, 1]); say(o, 0);
      break;
    case 'lanehog':
      o.x0 = o.x = ROAD_L + LANE_W * clamp(Math.round((player.x - ROAD_L) / LANE_W), 1, 3); o.vy = 75 + 40 * d; say(o, 0);
      break;
    case 'cutin':
      o.x = laneX(pick([pl - 1, pl + 1].filter(l => l >= 0 && l <= 3))); o.y = H + 90;
      o.delay = .75; addWarn('bottom', o.x, .75, '칼치기!');
      break;
    case 'exit': {
      const left = Math.random() < .5;
      o.x = laneX(left ? 0 : 3); o.dir = left ? 1 : -1; o.vy = 110; o.trigY = H * rand(.1, .2);
      break;
    }
    case 'uturn': {
      const L = pick([0, 1, 2, 3]);
      o.x = laneX(L); o.dir = L < 2 ? 1 : -1; o.vy = 100; o.trigY = H * rand(.08, .15); o.ownAng = true;
      break;
    }
    case 'tailgate':
      o.x = player.x; o.y = H + 90; o.delay = .8; addWarn('bottom', o.x, .8, '빵빵!');
      break;
  }
  S.ipjs.push(o);
  S.lastPat = pat; S.first = false;
  if (S.mode === 'play') {
    S.banner = { text: PAT[pat].banner, t: 0 };
    if (['wrongway', 'charge', 'zigzag', 'reverse', 'cutin'].includes(pat)) setTimeout(honk, o.delay * 1000);
  }
}
function choosePat() {
  if (S.mode === 'title') return pick(['zigzag', 'spin']);
  let pool = TIERS.filter(([t]) => S.t >= t).flatMap(([, p]) => p).filter(p => p !== S.lastPat);
  if (S.ipjs.some(o => o.delay > 0 || FAST.has(o.pat))) pool = pool.filter(p => !FAST.has(p));
  return pick(pool);
}

/* ───── 효과 ───── */
function burst(x, y, colors, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(60, 260) * power;
    S.parts.push({ k: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, ang: rand(0, 6), va: rand(-10, 10),
      s: rand(3, 7), life: rand(.8, 1.6), t: 0, c: pick(colors) });
  }
}
function smoke(x, y, r = 8) { S.parts.push({ k: 'smoke', x: x + rand(-4, 4), y: y + rand(-4, 4), r, life: rand(.7, 1.1), t: 0 }); }
function skid(o) {
  if (S.skids.length > 700) S.skids.splice(0, 40);
  const c = Math.cos(o.ang), s = Math.sin(o.ang);
  for (const sx of [-1, 1]) {
    const lx = sx * (o.w / 2 - 5), ly = o.h / 2 - 12;
    S.skids.push({ x: o.x + lx * c - ly * s, y: o.y + lx * s + ly * c, a: 1 });
  }
}
function floatText(text, x, y, color = '#fff', size = 18) { S.floats.push({ text, x, y, t: 0, life: 1.1, color, size }); }

/* ───── 충돌(돌아간 네모끼리) ───── */
function corners(o, pad = 0) {
  const c = Math.cos(o.ang), s = Math.sin(o.ang), hw = o.w / 2 * o.hit + pad, hh = o.h / 2 * o.hit + pad;
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([a, b]) => [o.x + a * c - b * s, o.y + a * s + b * c]);
}
function overlap(A, B) {
  for (const P of [A, B]) for (let i = 0; i < 4; i++) {
    const p1 = P[i], p2 = P[(i + 1) % 4], nx = p2[1] - p1[1], ny = p1[0] - p2[0];
    let a0 = 1e9, a1 = -1e9, b0 = 1e9, b1 = -1e9;
    for (const q of A) { const d = q[0] * nx + q[1] * ny; if (d < a0) a0 = d; if (d > a1) a1 = d; }
    for (const q of B) { const d = q[0] * nx + q[1] * ny; if (d < b0) b0 = d; if (d > b1) b1 = d; }
    if (a1 < b0 || b1 < a0) return false;
  }
  return true;
}
const near = (a, b, r = 120) => Math.abs(a.x - b.x) < r && Math.abs(a.y - b.y) < r;

function wreckCar(c, o) {
  c.wreck = true; c.va = rand(2.5, 5) * (Math.random() < .5 ? -1 : 1); c.vx = c.x > o.x ? 120 : -120;
  S.victims++;
  burst((c.x + o.x) / 2, (c.y + o.y) / 2, [c.color, '#ddd', '#222'], 9, .7);
  floatText('쾅!', c.x, c.y - 20, '#ffd23f', 20);
  sfx('bump', S.mode === 'play' ? 1 : .4);
  if (!o.bubble || o.bubbleT < .6) { o.bubble = pick(['제 잘못 아니에요!', '왜 거기 서 있어!', '어? 뭐 박았나?']); o.bubbleT = 1.6; }
}

function crash(other, cause) {
  S.mode = 'crash'; S.crashT = 0; S.cause = cause; S.shake = 16;
  const mx = (player.x + other.x) / 2, my = (player.y + other.y) / 2;
  burst(mx, my, [player.color, other.color || '#ff5fa2', '#eee', '#222', '#ffd23f'], 22, 1.3);
  for (let i = 0; i < 6; i++) smoke(mx, my, 12);
  floatText('쾅!!', mx, my - 30, '#ffd23f', 40);
  player.va = (player.x < other.x ? -1 : 1) * 5;
  other.va = -player.va * .7; other.crashed = true;
  if (!other.ipj) other.wreck = true;
  else { other.bubble = pick(['그러게 왜 거기 있어!', '내 차 흠집 났잖아!', '보험 부르면 되지~']); other.bubbleT = 3; }
  sfx('crash');
  crashes++; store.set('crashes', crashes);
}

function nearMiss(o) {
  S.near++;
  S.combo = T - S.comboT < 4 ? S.combo + 1 : 1; S.comboT = T;
  const pts = 100 * S.combo; S.bonus += pts;
  floatText(S.combo > 1 ? `아슬아슬 x${S.combo}  +${pts}` : `아슬아슬! +${pts}`, player.x, player.y - 46, '#ffd23f', 17);
  S.shake = Math.max(S.shake, 3);
  sfx('near');
}

/* ───── 갱신 ───── */
function update(dt) {
  if (S.mode === 'pause' || S.mode === 'report') return;
  if (S.mode === 'crash') {
    S.crashT += dt;
    if (S.crashT > 1.25) { showReport(); return; }
    dt *= S.crashT < .12 ? 1 : .3;
  }
  if (S.mode === 'play') S.t += dt;
  const d = diff();
  S.v = S.mode === 'title' ? 190 : S.mode === 'crash' ? S.v * (1 - dt * 3) : 230 + 270 * d;
  const v = S.v;
  S.roadY += v * dt;
  if (S.mode === 'play') S.dist += v * dt / 10;

  // 내 차
  if (S.mode === 'play') {
    let kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (drag) { tx = drag.px + (pointer.x - drag.sx) * 1.3; ty = drag.py + (pointer.y - drag.sy) * 1.3; }
    else if (kx || ky) { tx = player.x + kx * 60; ty = player.y + ky * 60; }
    tx = clamp(tx, ROAD_L + 20, ROAD_R - 20); ty = clamp(ty, H * .3, H - 46);
    const k = drag ? 18 : (kx || ky) ? 5.5 : 0;
    if (k) {
      const nx = player.x + (tx - player.x) * Math.min(1, dt * k);
      const vx = (nx - player.x) / dt;
      player.x = nx; player.y += (ty - player.y) * Math.min(1, dt * k);
      player.ang += (clamp(vx / 900, -.32, .32) - player.ang) * Math.min(1, dt * 12);
    } else player.ang *= 1 - Math.min(1, dt * 8);
  } else if (S.mode === 'crash') {
    player.ang += player.va * dt; player.va *= 1 - dt * 2;
  }

  // 일반 차
  S.nextTraffic -= dt;
  if (S.nextTraffic <= 0) { S.nextTraffic = rand(.9, 1.9) * (1 - .4 * d); spawnTraffic(); }
  S.traffic.sort((a, b) => a.y - b.y);
  for (const c of S.traffic) {
    c.vy = c.wreck ? v : v * (1 - c.frac);
    if (!c.wreck) for (const a of S.traffic) {   // 앞차를 들이받지 않게 속도 맞춤
      if (a === c || a.y >= c.y || a.lane !== c.lane) continue;
      if (c.y - a.y < (a.h + c.h) / 2 + 22) c.vy = Math.max(c.vy, a.vy);
    }
    c.y += c.vy * dt;
    if (c.wreck) {
      c.ang += c.va * dt; c.va *= 1 - dt * 2.5; c.x = clamp(c.x + c.vx * dt, ROAD_L + 18, ROAD_R - 18); c.vx *= 1 - dt * 3;
      if ((c.smokeT -= dt) < 0) { c.smokeT = .16; smoke(c.x, c.y - c.h * .3, 7); }
    }
  }
  S.traffic = S.traffic.filter(c => c.y < H + 160);

  // 이핑재핑
  S.nextIPJ -= dt;
  const maxIPJ = S.mode === 'title' ? 1 : 1 + (S.t > 45) + (S.t > 100);
  if (S.nextIPJ <= 0 && S.mode !== 'crash') {
    if (S.ipjs.length < maxIPJ) { spawnIPJ(choosePat()); S.nextIPJ = Math.max(1.1, 2.6 - 1.5 * d) + rand(0, .8); }
    else S.nextIPJ = .3;
  }
  for (const o of S.ipjs) updIPJ(o, dt, v, d);
  S.ipjs = S.ipjs.filter(o => o.delay > 0 || o.t < 1 || (o.y > -180 && o.y < H + 180));

  // 이핑재핑이 남의 차를 박음
  for (const o of S.ipjs) {
    if (o.delay > 0) continue;
    const oc = corners(o);
    for (const c of S.traffic) if (!c.wreck && near(o, c) && overlap(oc, corners(c))) wreckCar(c, o);
  }

  // 내 차 충돌·아슬아슬
  if (S.mode === 'play') {
    const P = corners(player), Pn = corners(player, 15);
    for (const c of S.traffic) if (near(c, player, 130) && overlap(P, corners(c))) { crash(c, { type: c.wreck ? 'wreck' : 'traffic' }); break; }
    if (S.mode === 'play') for (const o of S.ipjs) {
      if (o.delay > 0) continue;
      o.nearCool -= dt;
      const oc = corners(o), close = near(o, player, 140);
      if (close && overlap(P, oc)) { crash(o, { type: 'ipj', pat: o.pat }); break; }
      const inN = close && overlap(Pn, oc);
      if (inN) o.nearIn = true;
      else if (o.nearIn) { o.nearIn = false; if (o.nearCool <= 0) { o.nearCool = 1; nearMiss(o); } }
    }
  }

  // 길바닥 글씨·횡단보도
  S.nextMark -= dt;

function updIPJ(o, dt, v, d) {
  if (o.delay > 0) { o.delay -= dt; return; }

  if (o.crashed) { o.y += v * .5 * dt; o.ang += o.va * dt; o.va *= 1 - dt * 2; return; }

      o.vx = (nx - o.x) / Math.max(dt, 1e-3); o.x = nx;

        if (o.vy < v * .85) skid(o);
      }
      break;
    case 'wrongway':
      if (o.t < dt * 1.5) say(o);
      o.vy = v + o.extra; o.y += o.vy * dt;
      break;
    case 'signal':
      if (o.phase === 0) { o.y += o.vy * dt; if (o.y > o.trigY) { o.phase = 1; o.pt = 0; o.sig = o.S; say(o, 0); } }
      else if (o.phase === 1) {
        o.vy = 55; o.y += o.vy * dt; o.pt += dt;
        if (o.pt > 1) { o.phase = 2; o.tgt = laneX(clamp(laneOf(o.x) - o.S, 0, 3)); say(o, 1); }
      } else {
        o.vy = 135 + 60 * d; o.vx = clamp((o.tgt - o.x) * 4, -190, 190);
        o.x += o.vx * dt; o.y += o.vy * dt;
      }
      break;
    case 'charge':
      if (o.t < dt * 1.5) say(o);

      if (o.y > player.y + 90) { const lim = 80 + 40 * d; o.vx = clamp((player.x - o.x) * 2, -lim, lim); }

      break;

      if (o.x > ROAD_R - 24) { o.x = ROAD_R - 24; o.vx = -Math.abs(o.vx); }

      if (Math.random() < dt * 5) smoke(o.x, o.y, 6);

    case 'parking':

          o.tgt = clamp(o.x + o.dirP * LANE_W * .5, ROAD_L + 40, ROAD_R - 40); o.sig = o.dirP;

      } else if (o.phase === 1) {

      break;
    case 'uturn':
      if (o.phase === 0) { o.y += o.vy * dt; if (o.y > o.trigY) { o.phase = 1; o.pt = 0; o.sx = o.x; o.vy0 = o.vy; o.sig = o.dir; say(o, 0); } }
      else if (o.phase === 1) {
        o.pt += dt; const p = Math.min(1, o.pt / 1.1), e = p * p * (3 - 2 * p);
        o.ang = o.dir * e * Math.PI; o.x = o.sx + o.dir * LANE_W * (1 - Math.cos(e * Math.PI));

        if (p >= 1) { o.phase = 2; o.sig = 0; }
      } else { o.vy = v + 140 + 100 * d; o.y += o.vy * dt; }
      break;
    case 'tailgate':
      if (o.phase === 0) {
        o.vy = -(260 + 80 * d); o.y += o.vy * dt; o.x += (player.x - o.x) * Math.min(1, dt * 2.5);
        if (o.y < player.y + 85) { o.phase = 1; o.pt = 0; o.hT = 0; o.flash = true; say(o, 0); }
      } else if (o.phase === 1) {
        o.pt += dt;
        const ny = o.y + (player.y + 78 - o.y) * Math.min(1, dt * 3), nx = o.x + (player.x - o.x) * Math.min(1, dt * 2.2);
        o.vy = (ny - o.y) / Math.max(dt, 1e-3); o.vx = (nx - o.x) / Math.max(dt, 1e-3); o.y = ny; o.x = nx;

      } else {
        o.vy += (-(v * .5 + 260) - o.vy) * Math.min(1, dt * 3); o.vx = clamp((o.tgt - o.x) * 5, -220, 220);
        o.x += o.vx * dt; o.y += o.vy * dt;

  }
  if (!o.ownAng) o.ang += (Math.atan2(o.vx || 0, Math.max(80, v - o.vy)) - o.ang) * Math.min(1, dt * 10);
}

function rr(x, y, w, h, r) {

  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}
const INK = '#1d1b22', GLASS = '#2c3954';
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt)), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

function drawRoad() {
  const ry = S.roadY;
  ctx.fillStyle = '#6fb35f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#cfc8b8'; ctx.fillRect(4, 0, ROAD_L - 4, H); ctx.fillRect(ROAD_R, 0, W - ROAD_R - 4, H);
  ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1;
  for (let y = (ry % 22) - 22; y < H; y += 22) {
    ctx.beginPath(); ctx.moveTo(4, y); ctx.lineTo(ROAD_L - 4, y); ctx.moveTo(ROAD_R + 4, y); ctx.lineTo(W - 4, y); ctx.stroke();
  }
  ctx.fillStyle = '#8f887a'; ctx.fillRect(ROAD_L - 4, 0, 4, H); ctx.fillRect(ROAD_R, 0, 4, H);
  ctx.fillStyle = '#3a3c44'; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
  // 아스팔트 얼룩
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  for (let i = 0; i < 9; i++) {
    const y = ((i * 173 + ry * 1) % (H + 120)) - 60, x = ROAD_L + 20 + ((i * 97) % (ROAD_R - ROAD_L - 40));
    ctx.beginPath(); ctx.ellipse(x, y, 18 + (i % 3) * 8, 9 + (i % 2) * 5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#f4f1e8'; ctx.fillRect(ROAD_L + 4, 0, 3, H); ctx.fillRect(ROAD_R - 7, 0, 3, H);
  for (let i = 1; i < 4; i++) {
    const x = ROAD_L + LANE_W * i - 1.5;
    for (let y = (ry % 58) - 58; y < H; y += 58) ctx.fillRect(x, y, 3, 28);
  }
  // 길바닥 표시
  for (const m of S.marks) {
    if (m.cross) {
      ctx.fillStyle = 'rgba(244,241,232,.88)';
      ctx.fillRect(ROAD_L + 8, m.y + 34, ROAD_R - ROAD_L - 16, 4);
      for (let x = ROAD_L + 12; x < ROAD_R - 16; x += 26) ctx.fillRect(x, m.y - 26, 15, 50);
    } else {
      ctx.save(); ctx.translate(m.x, m.y); ctx.scale(1, 1.9);
      ctx.fillStyle = 'rgba(244,241,232,.82)'; ctx.font = '18px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      m.lines.forEach((ln, i) => ctx.fillText(ln, 0, (i - (m.lines.length - 1) / 2) * 15));
      ctx.restore();
    }

    const y = ((i * 96 + ry) % (12 * 96)) - 60;
    if (y > H + 40) continue;
    for (const side of [0, 1]) {
      const x = side ? W - 2 : 2, r = 15 + ((i * 7 + side * 3) % 5);
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(x + 3, y + 4, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = (i + side) % 3 ? '#4e9a48' : '#5aa850'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .3, r * .4, 0, Math.PI * 2); ctx.fill();
    }

}

function drawSedan(o, extra) {
  const { w, h } = o, col = o.color;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 10); ctx.fill();
  ctx.fillStyle = '#16151a';

  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(-w / 2 + 3, -h / 2 + 6, 5, h - 12, 3); ctx.fill();

}
function drawLights(o) {
  const { w, h } = o;
  if (o.avante) {   // 날렵한 LED 헤드램프
    ctx.fillStyle = '#e6f3ff'; ctx.strokeStyle = INK; ctx.lineWidth = 1;
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sx * (w / 2 - 2), -h / 2 + 8); ctx.lineTo(sx * (w / 2 - 13), -h / 2 + 2.5);
      ctx.lineTo(sx * (w / 2 - 13), -h / 2 + 5.5); ctx.lineTo(sx * (w / 2 - 3), -h / 2 + 11); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

  }
  if (o.flash && (T * 7 | 0) % 2 === 0) {   // 상향등 번쩍
    ctx.fillStyle = 'rgba(255,244,190,.55)';

    ctx.fillStyle = o.rev ? 'rgba(255,255,255,.4)' : 'rgba(255,40,40,.35)';
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * (w / 2 - 7), h / 2 - 3, 13, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.fillStyle = o.rev ? '#ffffff' : br ? '#ff3030' : '#a8202a';
  if (o.avante) { rr(-w / 2 + 3, h / 2 - 5.5, w - 6, 3.2, 1.6); ctx.fill(); }   // 일자 테일램프

}
function eyes(o, style) {

  ctx.restore();
}
function hyundai(x, y, k) {   // 현대 엠블럼: 은색 타원 + 기울어진 H
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.fillStyle = '#2a3140'; ctx.beginPath(); ctx.ellipse(0, 0, 5.4, 3.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#d7dbe2'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, 4.6, 2.9, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = .9; ctx.beginPath();
  ctx.moveTo(-1.7, -2.2); ctx.lineTo(-2.5, 2.2);
  ctx.moveTo(2.5, -2.2); ctx.lineTo(1.7, 2.2);
  ctx.moveTo(-2.3, .9); ctx.lineTo(2.3, -.9);
  ctx.stroke();
  ctx.restore();
}
function drawIPJ(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.ang);
  if (!o.crashed) ctx.translate(Math.sin(T * 24) * .5, 0);   // 공회전 떨림
  // 하얀 아반떼: 쐐기형 차체·Z자 옆 주름·선루프·긴 패스트백 유리·일자 테일램프
  const { w, h } = o, body = o.color;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 11); ctx.fill();
  ctx.fillStyle = '#16151a';
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) { rr(sx * w / 2 - 3.5, sy * (h / 2 - 15) - 7, 7, 14, 2); ctx.fill(); }
  ctx.fillStyle = body; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 6, -h / 2); ctx.lineTo(w / 2 - 6, -h / 2); ctx.quadraticCurveTo(w / 2, -h / 2 + 1, w / 2, -h / 2 + 11);
  ctx.lineTo(w / 2, h / 2 - 8); ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - 7, h / 2);
  ctx.lineTo(-w / 2 + 7, h / 2); ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - 8);
  ctx.lineTo(-w / 2, -h / 2 + 11); ctx.quadraticCurveTo(-w / 2, -h / 2 + 1, -w / 2 + 6, -h / 2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.17)'; ctx.lineWidth = 1.2;
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * (w / 2 - 3), -h / 2 + 14); ctx.lineTo(sx * (w / 2 - 6.5), 3); ctx.lineTo(sx * (w / 2 - 3), h / 2 - 12); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-8, -h / 2 + 3); ctx.lineTo(-10, -h / 2 + 11); ctx.moveTo(8, -h / 2 + 3); ctx.lineTo(10, -h / 2 + 11); ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.fillStyle = GLASS;
  ctx.beginPath(); ctx.moveTo(-w / 2 + 7, -h / 2 + 12); ctx.lineTo(w / 2 - 7, -h / 2 + 12); ctx.lineTo(w / 2 - 4, -h / 2 + 25); ctx.lineTo(-w / 2 + 4, -h / 2 + 25); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8e8e3'; rr(-w / 2 + 5, -h / 2 + 25, w - 10, 17, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = GLASS; rr(-6, -h / 2 + 28, 12, 8, 2); ctx.fill();
  const ry = -h / 2 + 42;
  ctx.beginPath(); ctx.moveTo(-w / 2 + 5, ry); ctx.lineTo(w / 2 - 5, ry); ctx.lineTo(w / 2 - 8, ry + 11); ctx.lineTo(-w / 2 + 8, ry + 11); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = body; ctx.lineWidth = 1.5;
  for (const sx of [-1, 1]) { rr(sx > 0 ? w / 2 - 1 : -w / 2 - 3, -h / 2 + 22, 4, 5, 1.5); ctx.fill(); ctx.stroke(); }
  // 문짝 긁힌 자국
  ctx.strokeStyle = 'rgba(60,60,70,.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(w / 2 - 2, -2); ctx.lineTo(w / 2 - 7, 6); ctx.moveTo(w / 2 - 2, 3); ctx.lineTo(w / 2 - 6, 9); ctx.stroke();
  drawLights(o);
  hyundai(0, -h / 2 + 6.5, 1); hyundai(0, h / 2 - 9.5, .9);
  eyes(o, 'angry');
  ctx.restore();
}
function drawPlayer() {
  ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.ang);
  // 가장 가까운 이핑재핑 쪽으로 눈동자
  let tgt = null, bd = 1e9;
  for (const o of S.ipjs) { if (o.delay > 0) continue; const dd = (o.x - player.x) ** 2 + (o.y - player.y) ** 2; if (dd < bd) { bd = dd; tgt = o; } }
  if (tgt && S.mode !== 'crash') {
    const a = Math.atan2(tgt.y - player.y, tgt.x - player.x) - player.ang;
    player.lookX = Math.cos(a) * 2; player.lookY = Math.sin(a) * 2;
  } else { player.lookX = 0; player.lookY = -1.5; }
  drawSedan(player, ry => {
    ctx.fillStyle = INK; ctx.font = '10px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('나', 0, ry + 16);
  });
  eyes(player, S.mode === 'crash' ? 'dizzy' : '');
  ctx.restore();
}

function bubble(text, x, y, below) {
  ctx.font = '13px Jua, sans-serif';
  const tw = ctx.measureText(text).width + 18, th = 24;
  const bx = clamp(x - tw / 2, 6, W - tw - 6);
  const by = below ? y + 10 : y - th - 10;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  rr(bx, by, tw, th, 9); ctx.fill(); ctx.stroke();
  const tx0 = clamp(x, bx + 12, bx + tw - 12);
  ctx.beginPath();
  if (below) { ctx.moveTo(tx0 - 6, by + 1); ctx.lineTo(tx0, by - 7); ctx.lineTo(tx0 + 6, by + 1); }
  else { ctx.moveTo(tx0 - 6, by + th - 1); ctx.lineTo(tx0, by + th + 7); ctx.lineTo(tx0 + 6, by + th - 1); }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, bx + 9, by + th / 2 + 1);
}
function nameTag(o) {
  const below = o.y < 110;
  const y = below ? o.y + 44 : o.y - 44;
  ctx.font = '11px Jua, sans-serif';
  const tw = ctx.measureText('이핑재핑').width + 12;
  const x = clamp(o.x, tw / 2 + 4, W - tw / 2 - 4);
  ctx.fillStyle = '#ff5fa2'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  rr(x - tw / 2, y - 9, tw, 18, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('이핑재핑', x, y + 1);
  if (o.bubble) bubble(o.bubble, o.x, below ? y + 8 : y - 8, below);
}
function txt(s, x, y, size, fill, align = 'left', line = 5) {
  ctx.font = `${size}px Jua, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = line; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function drawWarn(w) {
  if ((w.t * 8 | 0) % 2) return;
  const top = w.side === 'top', y = top ? 30 : H - 30, x = clamp(w.x, 40, W - 40);
  ctx.fillStyle = '#ff3b3b'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (top) { ctx.moveTo(x, y - 18); ctx.lineTo(x + 20, y + 16); ctx.lineTo(x - 20, y + 16); }
  else { ctx.moveTo(x, y + 18); ctx.lineTo(x + 20, y - 16); ctx.lineTo(x - 20, y - 16); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  txt('!', x, top ? y + 12 : y + 2, 22, '#fff', 'center', 3);
  txt(w.label, x, top ? y + 38 : y - 22, 16, '#ff3b3b', 'center', 4);
}
function drawHUD() {
  if (S.mode === 'title') return;
  txt('점수', 14, 26, 13, '#ffd23f', 'left', 4);
  txt(score().toLocaleString(), 14, 56, 30, '#fff', 'left', 6);
  txt(`${Math.floor(S.dist).toLocaleString()}m · ${Math.round(S.v * .36)}km/h`, 14, 76, 13, '#fff', 'left', 4);
  if (S.combo > 1 && T - S.comboT < 4) txt(`아슬아슬 x${S.combo}`, 14, 96, 14, '#ffd23f', 'left', 4);
  if (S.banner) {
    const b = S.banner, a = Math.min(1, b.t * 6, (1.8 - b.t) * 4);
    ctx.globalAlpha = a;
    ctx.font = '17px Jua, sans-serif';
    const tw = ctx.measureText(b.text).width + 46, y = 128;
    ctx.fillStyle = INK; rr(W / 2 - tw / 2, y - 17, tw, 34, 8); ctx.fill();
    ctx.save(); rr(W / 2 - tw / 2 + 3, y - 14, tw - 6, 28, 6); ctx.clip();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 - tw / 2, y - 17, tw, 34);
    ctx.fillStyle = INK;
    for (let x = W / 2 - tw / 2 - 30; x < W / 2 + tw / 2; x += 16) { ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x + 8, y + 14); ctx.lineTo(x + 18, y - 14); ctx.lineTo(x + 10, y - 14); ctx.fill(); }
    ctx.fillStyle = '#ffd23f'; rr(W / 2 - tw / 2 + 14, y - 11, tw - 28, 22, 4); ctx.fill();
    ctx.restore();
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.text, W / 2, y + 1);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.save();
  if (S.shake > .3) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  drawRoad();
  for (const c of S.traffic) drawCar(c);
  for (const o of S.ipjs) if (o.delay <= 0) drawIPJ(o);
  if (S.mode !== 'title') drawPlayer();
  for (const p of S.parts) {
    const a = 1 - p.t / p.life;
    if (p.k === 'smoke') { ctx.fillStyle = `rgba(230,228,222,${.5 * a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang); ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.c; ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .7); ctx.strokeRect(-p.s / 2, -p.s / 2, p.s, p.s * .7); ctx.restore(); }
  }
  if (S.mode !== 'title') for (const o of S.ipjs) if (o.delay <= 0) nameTag(o);
  for (const w of S.warns) drawWarn(w);
  for (const f of S.floats) {
    ctx.globalAlpha = Math.min(1, (1 - f.t / f.life) * 2.5);
    txt(f.text, clamp(f.x, 60, W - 60), f.y, f.size, f.color, 'center', Math.max(4, f.size / 5));
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawHUD();
}

/* ───── 입력 ───── */
const keys = {};
let drag = null; const pointer = { x: 0, y: 0 };
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
cv.addEventListener('pointerdown', e => {
  if (S.mode !== 'play') return;
  const p = toGame(e); pointer.x = p.x; pointer.y = p.y;
  drag = { sx: p.x, sy: p.y, px: player.x, py: player.y };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (!drag) return; const p = toGame(e); pointer.x = p.x; pointer.y = p.y; });
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && (S.mode === 'title' || S.mode === 'report') && !e.repeat) { e.preventDefault(); start(); }
  if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) { if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') pause(); });

/* ───── 화면 전환 ───── */
function show(id) { for (const k of ['title', 'pause', 'report']) $(k).hidden = k !== id; $('hud').hidden = !(id === null); }
function start() {
  S = newState('play');
  Object.assign(player, { x: W / 2, y: H - 120, ang: 0, va: 0 });
  tx = player.x; ty = player.y; drag = null;
  show(null); sfx('start');
}
function goTitle() { S = newState('title'); refreshTitle(); show('title'); }
function pause() { S.mode = 'pause'; drag = null; show('pause'); }
function resume() { S.mode = 'play'; show(null); }
function refreshTitle() {
  $('recBest').textContent = `최고 ${best.toLocaleString()}점`;
  $('recBest').hidden = !best;
}
function setMute(on) { sfxOn = on; store.set('sound', on); $('btnMute').textContent = on ? '🔊' : '🔇'; }

function showReport() {
  S.mode = 'report';
  const sc = score(), isBest = sc > best;
  if (isBest) { best = sc; store.set('best', best); }
  const c = S.cause || { type: 'traffic' };
  const now = new Date(), p2 = n => String(n).padStart(2, '0');
  $('rNo').textContent = `제 ${String(crashes).padStart(4, '0')} 호`;
  $('rDate').textContent = `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${p2(now.getHours())}:${p2(now.getMinutes())}`;
  $('rPlace').textContent = pick(PLACES);
  let car, type, says, fa, fb, stamp;
  if (c.type === 'ipj') {
    car = '하얀 아반떼 · 이핑재핑 (난폭운전 상습)'; type = PAT[c.pat].name; says = `“${pick(PAT[c.pat].says)}”`;
    fa = 100; fb = 0; stamp = '이핑<br>재핑';
  } else if (c.type === 'wreck') {
    car = '이핑재핑한테 먼저 박힌 차'; type = '이핑재핑이 낸 사고 현장에 추돌'; says = '“저는 이미 한 번 박혀서 서 있었어요 ㅠㅠ”';
    fa = 70; fb = 30; stamp = '이핑<br>재핑';
  } else {
    car = '지나가던 평범한 차'; type = '이핑재핑 피하다 다른 차와 접촉'; says = '“저는 그냥 가고 있었는데요…”';
    fa = 0; fb = 100; stamp = '확인';
  }
  $('rCar').textContent = car; $('rType').textContent = type; $('rSays').textContent = says;
  const fA = $('rFa'), fB = $('rFb');
  const aName = c.type === 'traffic' ? '상대' : '이핑재핑';
  fA.style.flex = fa ? fa : '0 0 0'; fB.style.flex = fb ? fb : '0 0 0';
  fA.textContent = fa ? `${aName} ${fa}` : ''; fB.textContent = fb ? `나 ${fb}` : '';
  $('rStamp').innerHTML = stamp;
  $('rDist').textContent = `${Math.floor(S.dist).toLocaleString()}m`;
  $('rNear').textContent = `${S.near}회`;
  $('rVic').textContent = `${S.victims}대`;
  $('rScore').textContent = sc.toLocaleString();
  $('rNew').hidden = !isBest;
  show('report'); sfx('over');
  // 다시 그려야 도장 애니메이션이 다시 돈다
  const paper = document.querySelector('.paper'); paper.style.animation = 'none'; paper.offsetWidth; paper.style.animation = '';
  const st = $('rStamp'); st.style.animation = 'none'; st.offsetWidth; st.style.animation = '';
}

const clickSfx = fn => () => { sfx('click'); fn(); };
$('btnStart').onclick = () => start();
$('btnRetry').onclick = () => start();
$('btnHome').onclick = clickSfx(goTitle);
$('btnQuit').onclick = clickSfx(goTitle);
$('btnResume').onclick = clickSfx(resume);
$('btnPause').onclick = clickSfx(pause);
$('btnMute').onclick = () => { setMute(!sfxOn); sfx('click'); };
$('ver').textContent = VERSION;
setMute(sfxOn);

/* ───── 돌리기 ───── */
goTitle();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T = now / 1000;
  if (stage.clientWidth !== lastSW || stage.clientHeight !== lastSH) resize();   // 크기 바뀜 신호를 못 받아도 따라감
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
